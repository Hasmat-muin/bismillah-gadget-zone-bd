<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bismillah Gadget Zone BD</title>
<style>
    :root{
        --primary:#071e2e;
        --accent:#c5a059;
        --accent-light:#e0be7a;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{
        width:100%;height:100%;
        overflow:hidden;
        background:#000;
        font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .splash{
        position:relative;
        width:100vw;
        height:100vh;
        height:100dvh;
        overflow:hidden;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:space-between;
    }

    /* 🎬 background video */
    .bg-video{
        position:absolute;
        top:50%;left:50%;
        min-width:100%;min-height:100%;
        width:auto;height:auto;
        transform:translate(-50%,-50%);
        object-fit:cover;
        z-index:1;
        filter:brightness(0.85) saturate(1.1);
    }

    /* dark gradient overlay for readability */
    .overlay{
        position:absolute;
        inset:0;
        z-index:2;
        background:
            linear-gradient(to bottom,
                rgba(4,12,20,0.75) 0%,
                rgba(4,12,20,0.25) 22%,
                rgba(4,12,20,0.35) 60%,
                rgba(4,12,20,0.92) 100%);
        pointer-events:none;
    }

    /* subtle animated glow accents */
    .glow{
        position:absolute;
        z-index:2;
        border-radius:50%;
        filter:blur(60px);
        opacity:0.35;
        pointer-events:none;
        animation:drift 7s ease-in-out infinite alternate;
    }
    .glow.g1{width:220px;height:220px;background:var(--accent);top:8%;left:-40px;}
    .glow.g2{width:260px;height:260px;background:#22d3ee;bottom:18%;right:-60px;animation-delay:1.5s;}
    @keyframes drift{
        0%{transform:translateY(0) scale(1);}
        100%{transform:translateY(-18px) scale(1.08);}
    }

    /* top brand block */
    .brand-block{
        position:relative;
        z-index:3;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        padding-top:calc(48px + env(safe-area-inset-top));
        opacity:0;
        animation:fadeDown 1s ease forwards 0.3s;
    }
    .brand-logo{
        height:66px;width:66px;
        border-radius:50%;
        object-fit:cover;
        border:2.5px solid var(--accent);
        box-shadow:0 0 22px rgba(197,160,89,0.55), 0 0 0 6px rgba(197,160,89,0.08);
        animation:pulseRing 2.6s ease-in-out infinite;
    }
    @keyframes pulseRing{
        0%,100%{box-shadow:0 0 18px rgba(197,160,89,0.45), 0 0 0 6px rgba(197,160,89,0.06);}
        50%{box-shadow:0 0 30px rgba(197,160,89,0.75), 0 0 0 10px rgba(197,160,89,0.12);}
    }
    .brand-name{
        font-size:16px;
        font-weight:800;
        letter-spacing:0.4px;
        color:#fff;
        text-shadow:0 2px 10px rgba(0,0,0,0.6);
    }
    .brand-name span{color:var(--accent);}

    @keyframes fadeDown{
        from{opacity:0; transform:translateY(-16px);}
        to{opacity:1; transform:translateY(0);}
    }

    /* bottom content block */
    .bottom-block{
        position:relative;
        z-index:3;
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:22px;
        padding:0 28px calc(42px + env(safe-area-inset-bottom));
        text-align:center;
    }

    .tagline-wrap{
        opacity:0;
        animation:fadeUp 1s ease forwards 0.6s;
    }
    .tagline-wrap h1{
        font-size:28px;
        font-weight:800;
        color:#fff;
        line-height:1.3;
        text-shadow:0 4px 16px rgba(0,0,0,0.5);
    }
    .tagline-wrap h1 .hl{
        color:var(--accent-light);
        background:linear-gradient(90deg, var(--accent-light), var(--accent));
        -webkit-background-clip:text;
        background-clip:text;
        -webkit-text-fill-color:transparent;
    }
    .tagline-wrap p{
        margin-top:10px;
        font-size:14px;
        color:#cbd5e1;
        font-weight:500;
        letter-spacing:0.2px;
    }

    @keyframes fadeUp{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
    }

    /* Get Started button */
    .get-started-btn{
        position:relative;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        width:100%;
        max-width:340px;
        padding:16px 20px;
        border:none;
        border-radius:50px;
        background:linear-gradient(135deg, var(--accent-light), var(--accent) 55%, #a9803f);
        color:#0f2635;
        font-size:16px;
        font-weight:800;
        letter-spacing:0.3px;
        text-decoration:none;
        cursor:pointer;
        box-shadow:0 10px 28px rgba(197,160,89,0.45), 0 0 0 0 rgba(197,160,89,0.6);
        opacity:0;
        animation:fadeUp 1s ease forwards 0.9s, breathe 2.4s ease-in-out infinite 2s;
        transition:transform 0.15s ease;
    }
    .get-started-btn:active{transform:scale(0.96);}
    .get-started-btn i{font-size:14px; transition:transform 0.25s ease;}
    .get-started-btn:active i{transform:translateX(4px);}

    @keyframes breathe{
        0%,100%{box-shadow:0 10px 28px rgba(197,160,89,0.45), 0 0 0 0 rgba(197,160,89,0.45);}
        50%{box-shadow:0 10px 32px rgba(197,160,89,0.6), 0 0 0 10px rgba(197,160,89,0);}
    }

    .skip-link{
        opacity:0;
        animation:fadeUp 1s ease forwards 1.1s;
        font-size:12.5px;
        color:#94a3b8;
        text-decoration:underline;
        text-underline-offset:3px;
    }

    /* small screens */
    @media (max-height:640px){
        .brand-block{padding-top:calc(28px + env(safe-area-inset-top));}
        .brand-logo{height:54px;width:54px;}
        .tagline-wrap h1{font-size:23px;}
        .bottom-block{gap:16px; padding-bottom:calc(28px + env(safe-area-inset-bottom));}
    }
</style>
</head>
<body>

<div class="splash">
    <video class="bg-video" autoplay muted loop playsinline preload="auto">
        <source src="sadsadsaddsa.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="brand-block">
        <img src="logo.JPG" alt="Bismillah Gadget Zone BD" class="brand-logo">
        <div class="brand-name">BISMILLAH <span>GADGET ZONE</span> BD</div>
    </div>

    <div class="bottom-block">
        <div class="tagline-wrap">
            <h1>Your Trusted <span class="hl">Gadget</span> Destination</h1>
            <p>Original Mobile, Watch &amp; Electronics — Best Price, Genuine Quality</p>
        </div>

        <a href="shop.html" class="get-started-btn">
            Get Started <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a href="shop.html" class="skip-link">Skip for now</a>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
    // fallback: if video fails to load, still allow navigation smoothly
    const vid = document.querySelector('.bg-video');
    vid.addEventListener('error', () => {
        document.querySelector('.splash').style.background =
            'radial-gradient(circle at top, #0f3047, #04121c)';
    });

    // gentle click feedback / navigate
    document.querySelectorAll('.get-started-btn, .skip-link').forEach(el=>{
        el.addEventListener('click', function(e){
            document.querySelector('.splash').style.transition = 'opacity 0.35s ease';
            document.querySelector('.splash').style.opacity = '0';
        });
    });
</script>

</body>
</html>
