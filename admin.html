<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bismillah Gadget Zone BD</title>
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        :root {
            --primary: #0f2635;
            --accent: #c5a059;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-main);
            margin: 0; padding: 0; color: var(--text-dark);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .login-container {
            background: var(--card-bg); padding: 40px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 38, 53, 0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box;
        }

        .login-container h2 { margin-bottom: 25px; color: var(--primary); font-size: 22px; font-weight: 700; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text-dark); }
        .input-group input, .input-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none;
        }

        .login-btn {
            background: var(--primary); color: var(--accent); border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer;
        }

        #adminPanelMain {
            display: none; width: 100%; max-width: 1200px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 20px; box-sizing: border-box;
        }

        .admin-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 25px;
        }

        .admin-header h1 { font-size: 22px; color: var(--primary); margin: 0; }

        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; font-weight: 600; border-radius: 6px; cursor: pointer; }

        .admin-sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .admin-card { background: #f8fafc; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 16px; }

        .admin-card h3 {
            margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 6px; display: inline-block; margin-bottom: 15px; font-size: 16px;
        }

        .btn-success {
            background: #10b981; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px;
        }

        .btn-secondary { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        .category-order-item {
            display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600;
        }

        .move-btn {
            background: #3b82f6; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
        }

        .product-manage-row {
            display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px;
        }

        .prod-info-left { display: flex; align-items: center; gap: 10px; }
        .prod-info-left img { width: 45px; height: 45px; object-fit: contain; border-radius: 4px; border: 1px solid #cbd5e1; background: #f8fafc; }

        .edit-prod-btn, .delete-prod-btn, .delete-cat-btn {
            border: none; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; color: white;
        }
        .edit-prod-btn { background: #3b82f6; margin-right: 4px; }
        .delete-prod-btn, .delete-cat-btn { background: #ef4444; }

        /* 🎨 কালার ভ্যারিয়েন্ট রো স্টাইল */
        .variant-row {
            display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; background: #ffffff; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px;
        }
        .variant-row input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; }

        .ck-editor__editable_inline { min-height: 180px; }
    </style>
</head>
<body>

    <!-- 🔐 LOGIN FORM -->
    <div class="login-container" id="loginCard">
        <h2>Admin Login Panel</h2>
        <form onsubmit="handleAdminLogin(event);">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="ইউজারনেম দিন" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>
    </div>

    <!-- 🛠️ ADMIN MAIN DASHBOARD -->
    <div id="adminPanelMain">
        <div class="admin-header">
            <h1>Bismillah Gadget Zone - Dashboard</h1>
            <button class="logout-btn" onclick="adminLogout()">Logout 🔓</button>
        </div>

        <div class="admin-sections">
            <div>
                <!-- 🔑 ADMIN SECURITY -->
                <div class="admin-card" style="background:#f0fdf4; border-color:#bbf7d0;">
                    <h3 style="color:#166534; border-bottom-color:#22c55e;">🔑 Admin Security (চেঞ্জ পাসওয়ার্ড)</h3>
                    <form onsubmit="updateAdminCredentials(event);">
                        <div class="input-group">
                            <label>New Username</label>
                            <input type="text" id="newAdminUser" placeholder="ইউজারনেম লিখুন" required>
                        </div>
                        <div class="input-group">
                            <label>New Password</label>
                            <input type="password" id="newAdminPass" placeholder="পাসওয়ার্ড লিখুন" required>
                        </div>
                        <button type="submit" class="btn-success" style="background:#16a34a;">Update Login Info 🔒</button>
                    </form>
                </div>

                <!-- 🖼️ Billboard -->
                <div class="admin-card">
                    <h3>🖼️ Manage Billboard Banners</h3>
                    <div class="input-group">
                        <label>Upload Banner Image OR MP4 Video</label>
                        <input type="file" id="billboardImageInput" accept="image/*,video/mp4">
                    </div>
                    <div class="input-group">
                        <label>Target Category</label>
                        <select id="billboardCategorySelect"></select>
                    </div>
                    <button class="btn-success" onclick="uploadBillboardBanner()" id="uploadBannerBtn" style="background:var(--primary); color:var(--accent);">Add Billboard Media 🚀</button>
                    
                    <div style="margin-top: 15px;">
                        <h4 style="font-size:13px; margin-bottom:8px; color:var(--primary);">Active Billboards:</h4>
                        <div id="adminBillboardList" style="display: flex; flex-direction: column; gap: 6px;"></div>
                        <button class="btn-success" onclick="saveBillboardOrder(event)" style="background:var(--primary); color:var(--accent); margin-top:10px;">Save Billboard Position 💾</button>
                    </div>
                </div>

                <!-- 📁 Create Category -->
                <div class="admin-card">
                    <h3>📁 Create Category</h3>
                    <form onsubmit="createNewCategory(event);">
                        <div class="input-group">
                            <label>New Category Name</label>
                            <input type="text" id="newCategoryName" placeholder="যেমন: Men Shoes" required>
                        </div>
                        <button type="submit" class="btn-success">Save Category ➕</button>
                    </form>
                </div>

                <!-- ↕️ Reorder Categories -->
                <div class="admin-card">
                    <h3>↕️ Reorder Categories</h3>
                    <div id="categoryOrderList"></div>
                    <button class="btn-success" onclick="saveCategoryOrder()" style="background:var(--primary); color:var(--accent);">Save New Position 💾</button>
                </div>

                <!-- 🗑️ Delete Categories -->
                <div class="admin-card">
                    <h3>🗑️ Delete / Manage Categories</h3>
                    <div id="adminCategoryList"></div>
                </div>

                <!-- 📑 POLICY PAGES EDITOR -->
                <div class="admin-card">
                    <h3>📑 Edit Footer Policy Pages</h3>
                    <div class="input-group">
                        <label>Select Page</label>
                        <select id="policyPageType" onchange="loadPageContentToEdit()">
                            <option value="refund">রিফান্ড ও রিটার্ন পলিসি (Refund Policy)</option>
                            <option value="terms">টার্মস এবং কন্ডিশন (Terms & Conditions)</option>
                            <option value="delivery">ডেলিভারি সংক্রান্ত তথ্য (Delivery Info)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Page Text</label>
                        <textarea id="policyDetails" rows="3"></textarea>
                    </div>
                    <button class="btn-success" onclick="savePageContent()">Save Policy Page 💾</button>
                </div>
            </div>

            <!-- 📦 Add/Edit Product (With Color Variant Option) -->
            <div class="admin-card" id="formScrollTarget">
                <h3 id="formActionTitle">📦 Add New Product</h3>
                
                <div class="input-group">
                    <label>Product Title</label>
                    <input type="text" id="prodName" placeholder="যেমন: T900 Ultra Smartwatch">
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>Regular Price (আসল দাম ৳)</label>
                        <input type="number" id="prodRegularPrice" placeholder="যেমন: 1500">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Offer Price (বিক্রয় মূল্য ৳)</label>
                        <input type="number" id="prodPrice" placeholder="যেমন: 1200">
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;">
                        <label>Stock Status</label>
                        <select id="prodStockStatus">
                            <option value="In Stock">In Stock (স্টকে আছে)</option>
                            <option value="Out of Stock">Out of Stock (স্টকে নেই)</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Stock Quantity</label>
                        <input type="number" id="prodStockQty" placeholder="যেমন: 10" value="10">
                    </div>
                </div>

                <div class="input-group">
                    <label>Category</label>
                    <select id="prodCategory"></select>
                </div>
                <div class="input-group">
                    <label>Sizes (Optional)</label>
                    <input type="text" id="prodSizes" placeholder="যেমন: 39, 40, 41, 42">
                </div>
                <div class="input-group">
                    <label>Video URL (Optional)</label>
                    <input type="url" id="prodVideo" placeholder="https://youtube.com/...">
                </div>
                <div class="input-group">
                    <label>Description / Specification</label>
                    <textarea id="prodDetails" placeholder="প্রোডাক্টের বিবরণ..." rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label>Main Showcase Image</label>
                    <input type="file" id="prodMainImage" accept="image/*">
                </div>

                <!-- 🎨 COLOR VARIANTS & DIFFERENT PRICES SECTION (পুনরায় যুক্ত করা হলো) -->
                <div style="margin-top:15px; margin-bottom:15px; background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
                    <label style="font-weight:bold; font-size:13px; color:var(--primary); display:block; margin-bottom:8px;">🎨 Color Variants & Prices (কালার, দাম ও আলাদা ছবি)</label>
                    <div id="variantContainer"></div>
                    <button type="button" class="btn-secondary" style="font-size:11px; margin-top:5px; background:var(--primary); color:var(--accent);" onclick="addVariantRow()">+ Add Color/Variant</button>
                </div>

                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button class="btn-success" onclick="uploadProductWithImages()" id="publishBtn" style="background:var(--primary); color:var(--accent);">Publish Product 🚀</button>
                    <button class="btn-secondary" onclick="resetFormToCreateMode()" id="cancelEditBtn" style="display:none; background:#ef4444;">Cancel Edit ✖</button>
                </div>
            </div>
        </div>

        <div class="admin-card" style="margin-top: 25px; background: #fff;">
            <h3>🛠️ Manage Products</h3>
            <div id="adminProductListContainer" style="margin-top: 15px; max-height: 500px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let isEditMode = false;
        let currentEditProductKey = "";
        let existingMainImageUrl = "";
        let editorInstance = null;
        let policyEditorInstance = null;
        let draggableCategories = [];
        let draggableBillboards = [];
        let existingVariantsData = {}; // কালার ভ্যারিয়েন্ট ডাটা

        const billboardURL = "https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/billboards.json";
        const authConfigURL = "https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/adminCredentials.json";

        ClassicEditor.create(document.querySelector('#prodDetails'), {
            toolbar: [ 'heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'insertTable', 'undo', 'redo' ]
        }).then(editor => { editorInstance = editor; }).catch(e => console.error(e));

        ClassicEditor.create(document.querySelector('#policyDetails'), {
            toolbar: [ 'heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'undo', 'redo' ]
        }).then(editor => { 
            policyEditorInstance = editor; 
            loadPageContentToEdit();
        }).catch(e => console.error(e));

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem("adminLoggedIn") === "true") showAdminPanel();
        });

        function showAdminPanel() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('adminPanelMain').style.display = 'block'; 
            document.body.style.alignItems = 'flex-start';
            loadCategoriesIntoDropdown();
            loadCategoriesIntoManageList();
            loadCategoryOrderEditor();
            loadProductsIntoManageList(); 
            loadBillboardCategoriesDropdown();
            loadAdminBillboards();
            loadCurrentAdminCredentials();
        }

        /* 🎨 কালার ভ্যারিয়েন্ট ফিল্ড যোগ করার ফংশন */
        function addVariantRow(colorName = "", colorPrice = "", colorImage = "") {
            const container = document.getElementById('variantContainer');
            const rowId = 'vRow_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

            const rowHTML = `
                <div class="variant-row" id="${rowId}">
                    <input type="text" class="v-color-name" placeholder="কালার নাম (যেমন: Black/Red)" value="${colorName}" style="flex:1; min-width:110px;">
                    <input type="number" class="v-color-price" placeholder="দাম (৳)" value="${colorPrice}" style="width:80px;">
                    <input type="file" class="v-color-img" accept="image/*" style="flex:1.2; min-width:140px;">
                    ${colorImage ? `<img src="${colorImage}" style="height:30px; width:30px; object-fit:cover; border-radius:4px;" class="v-existing-img" data-src="${colorImage}">` : ''}
                    <button type="button" onclick="document.getElementById('${rowId}').remove()" style="background:#ef4444; color:white; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;">×</button>
                </div>
            `;
            container.innerHTML += rowHTML;
        }

        /* 🔒 সিকিউরিটি ও পাসওয়ার্ড আপডেট */
        async function loadCurrentAdminCredentials() {
            try {
                const res = await fetch(authConfigURL);
                const creds = await res.json();
                if (creds) {
                    document.getElementById('newAdminUser').value = creds.user || "admin";
                    document.getElementById('newAdminPass').value = creds.pass || "admin123";
                } else {
                    document.getElementById('newAdminUser').value = "admin";
                    document.getElementById('newAdminPass').value = "admin123";
                }
            } catch(e) { console.error(e); }
        }

        async function updateAdminCredentials(e) {
            e.preventDefault();
            const user = document.getElementById('newAdminUser').value.trim();
            const pass = document.getElementById('newAdminPass').value.trim();
            if (!user || !pass) return alert("ইউজারনেম ও পাসওয়ার্ড দিন!");

            await fetch(authConfigURL, {
                method: 'PUT',
                body: JSON.stringify({ user, pass })
            });

            alert("🎉 পাসওয়ার্ড সেভ করা হয়েছে!");
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const inputUser = document.getElementById('adminUser').value.trim();
            const inputPass = document.getElementById('adminPass').value.trim();

            let validUser = "admin";
            let validPass = "admin123";

            try {
                const res = await fetch(authConfigURL);
                const creds = await res.json();
                if (creds && creds.user && creds.pass) {
                    validUser = creds.user;
                    validPass = creds.pass;
                }
            } catch(err) { console.error(err); }

            if (inputUser === validUser && inputPass === validPass) {
                sessionStorage.setItem("adminLoggedIn", "true");
                showAdminPanel();
            } else { alert("❌ ভুল লগইন ডাটা!"); }
        }

        async function createNewCategory(e) {
            e.preventDefault();
            const catName = document.getElementById('newCategoryName').value.trim();
            if (!catName) return;

            await fetch(catURL, { method: 'POST', body: JSON.stringify({ name: catName }) });
            alert(`📁 "${catName}" ক্যাটাগরি তৈরি হয়েছে!`);
            document.getElementById('newCategoryName').value = "";
            await loadCategoriesIntoDropdown();
            await loadCategoriesIntoManageList();
            await loadCategoryOrderEditor();
        }

        async function loadCategoriesIntoDropdown() {
            const dropdown = document.getElementById('prodCategory');
            if(!dropdown) return;
            dropdown.innerHTML = '<option value="">ক্যাটাগরি সিলেক্ট করুন</option>';
            const res = await fetch(catURL);
            const catData = await res.json();
            if (catData) {
                Object.keys(catData).forEach(key => {
                    dropdown.innerHTML += `<option value="${catData[key].name}">${catData[key].name}</option>`;
                });
            }
        }

        async function loadCategoriesIntoManageList() {
            const list = document.getElementById('adminCategoryList');
            if (!list) return;
            const res = await fetch(catURL);
            const catData = await res.json();
            list.innerHTML = "";
            if (catData) {
                Object.keys(catData).forEach(key => {
                    list.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:#fff; padding:8px 12px; border-radius:6px; border:1px solid #cbd5e1; font-size:13px; font-weight:600;">
                            <span>📁 ${catData[key].name}</span>
                            <button class="delete-cat-btn" onclick="deleteCategory('${key}', '${catData[key].name}')">Delete 🗑️</button>
                        </div>
                    `;
                });
            } else {
                list.innerHTML = "<small style='color:#64748b;'>কোনো ক্যাটাগরি নেই</small>";
            }
        }

        async function deleteCategory(categoryKey, categoryName) {
            if (!confirm(`ক্যাটাগরি "${categoryName}" ডিলিট করতে চান?`)) return;
            await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/categories/${categoryKey}.json`, { method: 'DELETE' });
            alert("🗑️ ডিলিট করা হয়েছে!");
            await loadCategoriesIntoDropdown();
            await loadCategoriesIntoManageList();
            await loadCategoryOrderEditor();
        }

        async function loadCategoryOrderEditor() {
            try {
                await fetchProducts(); 
                draggableCategories = [...activeCategories];
                renderOrderList();
            } catch(e){ console.error(e); }
        }

        function renderOrderList() {
            const list = document.getElementById('categoryOrderList');
            if(!list) return;
            list.innerHTML = "";
            draggableCategories.forEach((cat, index) => {
                list.innerHTML += `
                    <div class="category-order-item">
                        <span>📁 ${cat}</span>
                        <div>
                            <button class="move-btn" onclick="moveCategory(${index}, -1)">⬆ Up</button>
                            <button class="move-btn" onclick="moveCategory(${index}, 1)">⬇ Down</button>
                        </div>
                    </div>
                `;
            });
        }

        function moveCategory(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= draggableCategories.length) return;
            const temp = draggableCategories[index];
            draggableCategories[index] = draggableCategories[newIndex];
            draggableCategories[newIndex] = temp;
            renderOrderList();
        }

        async function saveCategoryOrder() {
            try {
                const res = await fetch("https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/categoryOrder.json", {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(draggableCategories)
                });
                if(res.ok) alert("🎉 ক্যাটাগরির নতুন পজিশন সেভ করা হয়েছে!");
            } catch(err) { alert("সেভ করতে সমস্যা হয়েছে!"); }
        }

        async function loadPageContentToEdit() {
            const pageType = document.getElementById('policyPageType').value;
            const res = await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/pages/${pageType}.json`);
            const data = await res.json();
            if (policyEditorInstance) policyEditorInstance.setData(data ? data.content : "");
        }

        async function savePageContent() {
            const pageType = document.getElementById('policyPageType').value;
            const content = policyEditorInstance ? policyEditorInstance.getData() : "";

            await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/pages/${pageType}.json`, {
                method: 'PUT',
                body: JSON.stringify({ content, updatedAt: Date.now() })
            });

            alert("🎉 পলিসি পেজের বিষয়বস্তু সেভ করা হয়েছে!");
        }

        async function loadBillboardCategoriesDropdown() {
            const dropdown = document.getElementById('billboardCategorySelect');
            if (!dropdown) return;
            dropdown.innerHTML = '<option value="">ক্যাটাগরি সিলেক্ট করুন (Optional)</option>';
            const res = await fetch(catURL);
            const catData = await res.json();
            if (catData) {
                Object.keys(catData).forEach(key => {
                    dropdown.innerHTML += `<option value="${catData[key].name}">${catData[key].name}</option>`;
                });
            }
        }

        async function loadAdminBillboards() {
            const list = document.getElementById('adminBillboardList');
            if (!list) return;
            try {
                const res = await fetch(billboardURL);
                const data = await res.json();
                list.innerHTML = "";
                if (!data) {
                    draggableBillboards = [];
                    list.innerHTML = "<p style='font-size:12px; color:#64748b;'>কোনো বিলবোর্ড নেই!</p>";
                    return;
                }
                
                draggableBillboards = Object.keys(data).map(key => ({
                    key: key,
                    ...data[key]
                })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                renderBillboardList();
            } catch(e) { console.error(e); }
        }

        function renderBillboardList() {
            const list = document.getElementById('adminBillboardList');
            if (!list) return;
            list.innerHTML = "";
            
            draggableBillboards.forEach((item, index) => {
                const srcUrl = item.mediaUrl || item.imageUrl || "";
                const isVideo = item.mediaType === "video" || srcUrl.includes('video') || srcUrl.includes('data:video');

                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:6px 10px; border:1px solid #cbd5e1; border-radius:6px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${isVideo ? 
                                `<video src="${srcUrl}" style="height:35px; width:60px; object-fit:cover; border-radius:4px;" muted></video>` : 
                                `<img src="${srcUrl}" style="height:35px; width:60px; object-fit:cover; border-radius:4px;">`
                            }
                            <small style="font-weight:600; color:#0f2635;">${item.category ? '📂 ' + item.category : 'সাধারণ ব্যানার'}</small>
                        </div>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <button class="move-btn" onclick="moveBillboard(${index}, -1)">⬆</button>
                            <button class="move-btn" onclick="moveBillboard(${index}, 1)">⬇</button>
                            <button class="delete-prod-btn" onclick="deleteBillboard('${item.key}')" style="margin-left:4px;">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function moveBillboard(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= draggableBillboards.length) return;
            const temp = draggableBillboards[index];
            draggableBillboards[index] = draggableBillboards[newIndex];
            draggableBillboards[newIndex] = temp;
            renderBillboardList();
        }

        async function saveBillboardOrder(event) {
            if (draggableBillboards.length === 0) return;
            const btn = event.target;
            btn.innerText = "Saving Order...";
            btn.disabled = true;

            try {
                const baseTime = Date.now();
                const promises = draggableBillboards.map((item, index) => {
                    const newCreatedAt = baseTime - (index * 1000);
                    return fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/billboards/${item.key}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ createdAt: newCreatedAt })
                    });
                });

                await Promise.all(promises);
                alert("🎉 বিলবোর্ডের পজিশন সেভ করা হয়েছে!");
                loadAdminBillboards();
            } catch(e) { alert("সমস্যা হয়েছে!"); } 
            finally {
                btn.innerText = "Save Billboard Position 💾";
                btn.disabled = false;
            }
        }

        async function uploadBillboardBanner() {
            const fileInput = document.getElementById('billboardImageInput');
            const file = fileInput.files[0];
            const category = document.getElementById('billboardCategorySelect').value;
            if (!file) return alert("ফাইল সিলেক্ট করুন!");

            let mediaUrl = await fileToBase64(file);
            let mediaType = file.type.includes('video') ? "video" : "image";

            await fetch(billboardURL, {
                method: 'POST',
                body: JSON.stringify({ mediaUrl, mediaType, category, createdAt: Date.now() })
            });

            alert("🎉 স্লাইডার ব্যানার সেভ হয়েছে!");
            fileInput.value = "";
            loadAdminBillboards();
        }

        function fileToBase64(file) {
            return new Promise((res, rej) => {
                const reader = new FileReader();
                reader.onload = () => res(reader.result);
                reader.onerror = e => rej(e);
                reader.readAsDataURL(file);
            });
        }

        async function deleteBillboard(key) {
            if (!confirm("ডিলিট করবেন?")) return;
            await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/billboards/${key}.json`, { method: 'DELETE' });
            loadAdminBillboards();
        }

        function adminLogout() {
            sessionStorage.removeItem("adminLoggedIn");
            window.location.reload();
        }

        async function loadProductsIntoManageList() {
            const container = document.getElementById('adminProductListContainer');
            const res = await fetch(dbURL);
            const data = await res.json();
            if(!data) { container.innerHTML = "<p>কোনো প্রোডাক্ট নেই!</p>"; return; }
            container.innerHTML = "";
            Object.keys(data).forEach(key => {
                const prod = data[key];
                const isOut = (prod.stockStatus === 'Out of Stock' || parseInt(prod.stockQty) <= 0);
                container.innerHTML += `
                    <div class="product-manage-row">
                        <div class="prod-info-left">
                            <img src="${prod.mainImage || 'logo.JPG'}">
                            <div>
                                <strong>${prod.name}</strong><br>
                                <small>${prod.category} - ৳${prod.price} | <b style="color:${isOut?'red':'green'}">${isOut?'Out of Stock':'In Stock ('+(prod.stockQty||10)+' Pcs)'}</b></small>
                            </div>
                        </div>
                        <div>
                            <button class="edit-prod-btn" onclick="prepareEditProduct('${key}')">Edit ✏️</button>
                            <button class="delete-prod-btn" onclick="deleteProductFromFirebase('${key}')">Delete 🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        async function prepareEditProduct(key) {
            const res = await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/products/${key}.json`);
            const prod = await res.json();
            if (!prod) return;

            isEditMode = true;
            currentEditProductKey = key;
            existingMainImageUrl = prod.mainImage || "";

            document.getElementById('formActionTitle').innerText = "✏️ Edit Product";
            document.getElementById('publishBtn').innerText = "Update Product 🔄";
            document.getElementById('cancelEditBtn').style.display = 'block';

            document.getElementById('prodName').value = prod.name || "";
            document.getElementById('prodRegularPrice').value = prod.regularPrice || prod.price || "";
            document.getElementById('prodPrice').value = prod.price || "";
            document.getElementById('prodStockStatus').value = prod.stockStatus || "In Stock";
            document.getElementById('prodStockQty').value = prod.stockQty !== undefined ? prod.stockQty : 10;
            document.getElementById('prodCategory').value = prod.category || "";
            document.getElementById('prodSizes').value = prod.sizes ? prod.sizes.join(', ') : "";
            document.getElementById('prodVideo').value = prod.video || "";
            
            if (editorInstance) editorInstance.setData(prod.details || "");

            // 🎨 এডিটের সময় কালার ভ্যারিয়েন্ট লোড করা
            const vContainer = document.getElementById('variantContainer');
            vContainer.innerHTML = "";
            if (prod.variants) {
                Object.keys(prod.variants).forEach(colorName => {
                    const vItem = prod.variants[colorName];
                    addVariantRow(colorName, vItem.price || prod.price, vItem.image || "");
                });
            }

            document.getElementById('formScrollTarget').scrollIntoView({ behavior: 'smooth' });
        }

        function resetFormToCreateMode() {
            isEditMode = false;
            currentEditProductKey = "";
            document.getElementById('formActionTitle').innerText = "📦 Add New Product";
            document.getElementById('publishBtn').innerText = "Publish Product 🚀";
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('prodName').value = "";
            document.getElementById('prodRegularPrice').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodStockStatus').value = "In Stock";
            document.getElementById('prodStockQty').value = "10";
            document.getElementById('variantContainer').innerHTML = "";
            if (editorInstance) editorInstance.setData("");
        }

        async function deleteProductFromFirebase(key) {
            if(!confirm("ডিলিট করবেন?")) return;
            await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/products/${key}.json`, { method: 'DELETE' });
            loadProductsIntoManageList();
        }

        async function uploadProductWithImages() {
            const name = document.getElementById('prodName').value.trim();
            const regularPrice = parseFloat(document.getElementById('prodRegularPrice').value) || parseFloat(document.getElementById('prodPrice').value);
            const price = parseFloat(document.getElementById('prodPrice').value);
            const stockStatus = document.getElementById('prodStockStatus').value;
            const stockQty = parseInt(document.getElementById('prodStockQty').value) || 0;
            const category = document.getElementById('prodCategory').value;
            const sizesRaw = document.getElementById('prodSizes').value.trim();
            const video = document.getElementById('prodVideo').value.trim();
            let details = editorInstance ? editorInstance.getData() : "";

            const mainImageFile = document.getElementById('prodMainImage').files[0];

            if (!name || isNaN(price) || !category) return alert("নাম, দাম ও ক্যাটাগরি পূরণ করুন!");

            const publishBtn = document.getElementById('publishBtn');
            publishBtn.innerText = "Saving...";
            publishBtn.disabled = true;

            try {
                let mainImage = existingMainImageUrl;
                if (mainImageFile) mainImage = await fileToBase64(mainImageFile);

                let sizes = sizesRaw ? sizesRaw.split(',').map(s => s.trim()) : [];

                // 🎨 কালার ভ্যারিয়েন্ট প্রসেসিং
                let variants = {};
                const variantRows = document.querySelectorAll('#variantContainer .variant-row');
                
                for (let row of variantRows) {
                    const cName = row.querySelector('.v-color-name')?.value.trim();
                    const cPrice = parseFloat(row.querySelector('.v-color-price')?.value) || price;
                    const imgInput = row.querySelector('.v-color-img');
                    const existingImgTag = row.querySelector('.v-existing-img');

                    let cImg = existingImgTag ? existingImgTag.getAttribute('data-src') : "";
                    if (imgInput && imgInput.files[0]) {
                        cImg = await fileToBase64(imgInput.files[0]);
                    }

                    if (cName) {
                        variants[cName] = {
                            price: cPrice,
                            image: cImg || mainImage
                        };
                    }
                }

                const productData = { name, regularPrice, price, stockStatus, stockQty, category, video, details, mainImage, sizes, variants };

                if (isEditMode) {
                    await fetch(`https://bismillah-gadget-zone-bd-default-rtdb.firebaseio.com/products/${currentEditProductKey}.json`, { 
                        method: 'PUT', body: JSON.stringify(productData) 
                    });
                } else {
                    await fetch(dbURL, { method: 'POST', body: JSON.stringify(productData) });
                }

                alert("🎉 প্রোডাক্ট সেভ করা হয়েছে!");
                window.location.reload();
            } catch (err) { alert("সমস্যা হয়েছে!"); publishBtn.disabled = false; }
        }
    </script>
</body>
</html>
